name: Build Windows widget

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify localization
        run: dotnet run --project tests/LocalizationChecks -c Release
      - name: Publish Windows executable
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: CodexTokenWidget-win-x64
          path: artifacts/CodexTokenWidget.exe
